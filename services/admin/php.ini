; .env editor (env.php) accepts files up to 10 MB; post_max_size leaves room
; for the form fields around it.
upload_max_filesize=10M
post_max_size=12M
; Startup warnings (e.g. an oversized POST) would otherwise be printed before
; any header, breaking the session and redirects. They still reach the log.
display_errors=Off
log_errors=On
